version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_dev:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    volumes:
      - ./backend/src:/app/src:ro
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/orvo-voice-ai-dev
      PORT: 5000
      NODE_ENV: development
    ports:
      - '5000:5000'
    depends_on:
      - mongo

volumes:
  mongo_data_dev:
